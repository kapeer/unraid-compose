version: "3"

x-common: &common
  labels:
    type: gameserver
  networks:
    - infra
x-owners: &owners
  UID: ${PUID:-1000}
  GID: ${PGID:-1000}
x-steam: &steam
  <<: *owners
  LOG_OUTPUT: "true"
x-restart-policy: &restart-policy
  condition: on-failure
  delay: 60s
  max_attempts: 3
  window: 10m

services:
  redbot:
    hostname: redbot
    container_name: redbot
    image: phasecorex/red-discordbot
    networks:
      - infra
    volumes:
      - redbot_data:/data
    environment:
      TZ: ${TZ:-Europe/Dublin}
      PUID: ${PUID:-1000}
      RED_TOKEN: ${DISCORD_TOKEN}
      PREFIX: ">"
    restart: unless-stopped
    
  discord-irc:
    hostname: discord-irc
    container_name: discord-irc
    image: discordirc/discord-irc
    networks:
      - infra
    volumes:
      - ${APP_PATH}/discord-irc:/config
    depends_on:
      - redbot
      - 7dtd
    deploy:
      replicas: 0
      restart_policy:
        <<: *restart-policy
        window: 15m
    
  discord-7dtd:
    hostname: discord-7dtd
    container_name: discord-7dtd
    image: kap33r/dishorde:latest
    networks:
      - infra
    volumes:
      - ${APP_PATH}/7dtd-discord/config.json:/bot/Dishorde/config.json
    depends_on:
      - redbot
      - 7dtd
    deploy:
      replicas: 0
      restart_policy:
        <<: *restart-policy
        window: 15m
      
  openssh-server:
    image: lscr.io/linuxserver/openssh-server:latest
    hostname: openssh-server
    container_name: openssh-server
    networks:
      - infra
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Dublin}
      - PASSWORD_ACCESS=true
      - USER_PASSWORD_FILE=${SSH_PWD_FILE}
      - USER_NAME=${SSH_USER}
    volumes:
      - ${APP_PATH}:${APP_PATH}
    ports:
      - 2222:2222
    deploy:
      restart_policy:
        condition: on-failure
        delay: 30s
        window: 30s
        
  mumble-server:
    image: mumblevoip/mumble-server:latest
    container_name: mumble-server
    hostname: mumble-server
    ports:
      - 64738:64738
    environment:
      MUMBLE_CONFIG_SERVER_PASSWORD: ${MUMBLE_SERVER_PWD}
      MUMBLE_SUPERUSER_PASSWORD: ${MUMBLE_SUPER_PWD}
    volumes:
      - mumble_data:/data
    restart: on-failure
    
  7dtd:
    <<: *common
    hostname: 7dtd
    container_name: 7dtd
    image: ich777/steamcmd:7dtd
    ports:
      - 26888-26890:26888-26890
      - 26900:26900/tcp
      - 26900-26903:26900-26903/udp
    environment:
      <<: *steam
      GAME_ID: 294420
      SERVERCONFIG: sdtdserverconfig.xml
      LOG_TIMESTAMP: "false"
      GAME_PARAMS: -quit -batchmode -nographics -dedicated
      BACKUP_FILES: "true"
      BACKUP_INTERVAL: 720
      BACKUP_TO_KEEP: 2
      VALIDATE: "true"
    volumes:
      - steamcmd_data:/serverdata/steamcmd
      - type: bind
        source: ${APP_PATH}/7dtd
        target: /serverdata/serverfiles
        bind:
          create_host_path: true
    deploy:
      replicas: 0
      restart_policy:
        <<: *restart-policy
        window: 15m
    
  7dtd-experimental2:
    <<: *common
    hostname: 7dtd-experimental2
    container_name: 7dtd-experimental2
    image: ich777/steamcmd:7dtd
    ipc: host # <-
    ports:
      - 26888-26890:26888-26890
      - 26900:26900/tcp
      - 26900-26903:26900-26903/udp
    environment:
      <<: *steam
      GAME_ID: 294420 -beta latest_experimental
      LOG_TIMESTAMP: "false"
      GAME_PARAMS: -quit -batchmode -nographics -dedicated -useHugePages # <-
      BACKUP_FILES: "true"
      BACKUP_INTERVAL: 720
      BACKUP_TO_KEEP: 2
    volumes:
      - steamcmd_data:/serverdata/steamcmd
      - type: bind
        source: /mnt/user/appdata/gameservers/7dtd-experimental2
        target: /serverdata/serverfiles
        bind:
          create_host_path: true
    ulimits:
      nofile:
        soft: 10240
        hard: 10240
      memlock:    # <-
        soft: -1  # <-
        hard: -1  # <-
    deploy:
      replicas: 1
      restart_policy:
        <<: *restart-policy
        window: 15m

  rust:
    <<: *common
    hostname: rust
    container_name: rust
    image: ich777/steamcmd:rust
    ports:
      - 28015:28015/udp
      - 28016:28016/tcp
      - 28083:28083/tcp
    environment:
      <<: *steam
      GAME_ID: 258550
      SERVER_NAME: SFORA Fun Server
      SERVER_DISCRIPTION: Rust Server in docker
      GAME_PORT: 28015
      GAME_PARAMS: +server.tickrate 30 +server.identity "rustserver" +server.gamemode vanilla +server.seed 57064 +server.maxplayers 20 +server.worldsize 4000 +server.saveinterval 300 +rcon.web 1 +rcon.password "${RUST_RCON_PWD}" +rcon.port 28016
    volumes:
      - steamcmd_data:/serverdata/steamcmd
      - type: bind
        source: ${APP_PATH}/rust
        target: /serverdata/serverfiles
        bind:
          create_host_path: true
    deploy:
      replicas: 0
      restart_policy: *restart-policy

  palworldv1:
    <<: *common
    hostname: palworld_v1
    container_name: palworld_v1
    image: ich777/steamcmd:palworld
    ports:
    - 8211:8211/udp
    - 25575:25575
    environment:
      <<: *steam
      GAME_ID: 2394010
      PORT: 8211 # Optional but recommended
      PLAYERS: 16 # Optional but recommended
      SERVER_PASSWORD: ${PALWORLD_PWD} # Optional but recommended
      TZ: "UTC"
      ADMIN_PASSWORD: ${PALWORLD_ADMIN_PWD} 
      COMMUNITY: false  # Enable this if you want your server to show up in the community servers tab, USE WITH SERVER_PASSWORD!
      SERVER_NAME: "Bazinga"
      SERVER_DESCRIPTION: "Bazinga Server"
      CROSSPLAY_PLATFORMS: "(Steam,Xbox,PS5,Mac)"
    volumes:
      - steamcmd_data:/serverdata/steamcmd
      - type: bind
        source: ${APP_PATH}/palworld_v1
        target: /serverdata/serverfiles
        bind:
          create_host_path: true
    deploy:
      replicas: 0
      restart_policy: *restart-policy

  mcatm10:
    <<: *common
    hostname: mcatm10
    container_name: mcatm10
    image: itzg/minecraft-server
    environment:
      <<: *owners
      EULA: "TRUE"
      TYPE: "NEOFORGE"
      VERSION: "1.21.1"
      NEOFORGE_VERSION: "21.1.214"
      OVERRIDE_SERVER_PROPERTIES: "TRUE"
      MAX_MEMORY: 12G
      SERVER_PORT: 9013
      RCON_PORT: 9014
      RCON_PASSWORD: "${MC_RCON_PWD}"
      MAX_PLAYERS: 10
      MOTD: "Minecraft ATM 10"
      OPS: ${MC_OPS}
      ENFORCE_WHITELIST: "true"
    ports:
      - 9013-9014:9013-9014
    volumes:
      - type: bind
        source: ${APP_PATH}/mcatm10
        target: /data
        bind:
          create_host_path: true
    deploy:
      replicas: 0
      restart_policy: *restart-policy   
      
  mcForge:
    <<: *common
    hostname: mcForge
    container_name: mcForge
    image: itzg/minecraft-server
    shm_size: '2gb' # <-
    ulimits:        # <-
      memlock:      # <-
        soft: -1    # <-
        hard: -1    # <-
    environment:
      <<: *owners
      EULA: "TRUE"
      TYPE: "FORGE"
      VERSION: "1.20.1"
      FORGE_VERSION: "47.4.10"
      OVERRIDE_SERVER_PROPERTIES: "TRUE"
      MAX_MEMORY: 8G
      JVM_OPTS: "-XX:+UseLargePages" # <-
      SERVER_PORT: 9013
      RCON_PORT: 9014
      RCON_PASSWORD: "${MC_RCON_PWD}"
      MAX_PLAYERS: 10
      MOTD: "Bazzzingowe QSMP"
      OPS: ${MC_OPS}
      ENFORCE_WHITELIST: "true"
    ports:
      - 9013-9014:9013-9014
    volumes:
      - type: bind
        source: ${APP_PATH}/mcForge
        target: /data
        bind:
          create_host_path: true
    deploy:
      replicas: 0
      restart_policy: *restart-policy
      
  mcPOK:
    <<: *common
    hostname: mcPOK
    container_name: mcPOK
    image: itzg/minecraft-server
    environment:
      <<: *owners
      EULA: "TRUE"
      TYPE: "NEOFORGE"
      VERSION: "1.21.1"
      FORGE_VERSION: "21.1.222"
      OVERRIDE_SERVER_PROPERTIES: "TRUE"
      MAX_MEMORY: 8G
      SERVER_PORT: 9010
      RCON_PORT: 9011
      RCON_PASSWORD: "${MC_RCON_PWD}"
      MAX_PLAYERS: 10
      MOTD: "Bazingowe Pokemony"
      OPS: ${MC_OPS}
      ENFORCE_WHITELIST: "true"
    ports:
      - 9010-9011:9010-9011
    volumes:
      - type: bind
        source: ${APP_PATH}/mcPOK
        target: /data
        bind:
          create_host_path: true
    deploy:
      replicas: 0
      restart_policy: *restart-policy      

  mcbds:
    <<: *common
    image: itzg/minecraft-bedrock-server
    hostname: mcbds
    container_name: mcbds
    environment:
      <<: *owners
      EULA: "TRUE"
      SERVER_NAME: "B&B World"
    ports:
      - "19132:19132/udp"
    networks:
      br0:
        ipv4_address: ${MC_BEDROCK_IP}
    mac_address: ${MC_BEDROCK_MAC}
    volumes:
      - type: bind
        source: ${APP_PATH}/mcbds
        target: /data
        bind:
          create_host_path: true
    stdin_open: true
    tty: true
    deploy:
      replicas: 0
      restart_policy: *restart-policy


  valheim:
     <<: *common
     hostname: valheim
     container_name: valheim
     image: ich777/steamcmd:valheim
     ports:
       - 9013-9014:2456-2457/udp
     environment:
       <<: *steam
       SRV_NAME: SFORA Fun Server
       SRV_PWD: ${VALHEIM_PWD}
       WORLD_NAME: Bazzzinga
       GAME_PARAMS: -savedir /serverdata/serverfiles/.config/unity3d/IronGate/Valheim
     volumes:
       - steamcmd_data:/serverdata/steamcmd
       - type: bind
         source: ${APP_PATH}/valheim
         target: /serverdata/serverfiles
         bind:
           create_host_path: true
     deploy:
       replicas: 0
       restart_policy:
         <<: *restart-policy
         window: 5m


  enshrouded:
     <<: *common
     hostname: enshrouded
     container_name: enshrouded
     image: mornedhels/enshrouded-server:latest
     ports:
       - 9013:15637/udp
     environment:
       <<: *steam
       SERVER_NAME: SFORA Fun Server
       PUID: 4711
       PGID: 4711
       # GAME_PARAMS: -savedir /serverdata/serverfiles/:/home/steam/enshrouded
       STEAMCMD_ARGS: validate
       SERVER_ROLE_0_NAME: Admins
       SERVER_ROLE_0_PASSWORD: ${ENSHROUDED_ADMIN_PWD}
       SERVER_ROLE_0_CAN_KICK_BAN: true
       SERVER_ROLE_0_CAN_ACCESS_INVENTORIES: true
       SERVER_ROLE_0_CAN_EDIT_WORLD: true
       SERVER_ROLE_0_CAN_EDIT_BASE: true
       SERVER_ROLE_0_CAN_EXTEND_BASE: true
       SERVER_ROLE_0_RESERVED_SLOTS: 1
       SERVER_ROLE_1_NAME: Friends
       SERVER_ROLE_1_PASSWORD: ${ENSHROUDED_FRIEND_PWD}
       SERVER_ROLE_1_CAN_ACCESS_INVENTORIES: true
       SERVER_ROLE_1_CAN_EDIT_WORLD: true
       SERVER_ROLE_1_CAN_EDIT_BASE: true
       SERVER_ROLE_1_CAN_EXTEND_BASE: true
       SERVER_ROLE_1_RESERVED_SLOTS: 3
       SERVER_ROLE_2_NAME: Guests
       SERVER_ROLE_2_PASSWORD: ${ENSHROUDED_GUEST_PWD}
     volumes:
       - type: bind
         source: ${APP_PATH}/enshrouded
         target: /home/steam/enshrouded
         bind:
           create_host_path: true
     deploy:
       replicas: 0
       restart_policy:
         <<: *restart-policy
         window: 5m

         
networks:
  infra:
    name: infra_default
    external: true
  br0:
    name: br0
    external: true
    
volumes:
  mumble_data:
    name: mumble_data
  steamcmd_data:
    name: steamcmd_data
  redbot_data:
    external: true
    name: redbot_data